name: Build RossoFuoco Android & iOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace || gradle assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RossoFuoco-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  package-ios:
    name: Package iOS Source & Assets
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Archive iOS Source Code
        run: |
          mkdir -p build-artifacts
          zip -r build-artifacts/RossoFuoco-iOS-Source.zip ios/

      - name: Upload iOS Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RossoFuoco-iOS-Source
          path: build-artifacts/RossoFuoco-iOS-Source.zip
