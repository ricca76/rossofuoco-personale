name: Deploy Android App to Google Play

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/deploy-playstore.yml'
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build & Publish Android Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build Release Bundle (AAB) & APK
        run: |
          gradle :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Upload App Bundle Artifact (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: RossoFuoco-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RossoFuoco-Release-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Upload to Google Play Internal Sharing / Track (if API JSON key exists)
        if: env.PLAY_CONFIG_JSON != ''
        env:
          PLAY_CONFIG_JSON: ${{ secrets.PLAY_STORE_JSON_KEY }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.rossofuoco.personale
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
