name: Deploy Android App to Google Play

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/deploy-playstore.yml'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track (internal, alpha, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: 'Release Status (completed, draft, inProgress, halted)'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - draft
          - inProgress
          - halted

jobs:
  build-and-publish:
    name: Build & Publish Android Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build Release Bundle (AAB) & APK
        run: |
          gradle :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Upload App Bundle Artifact (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: RossoFuoco-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RossoFuoco-Release-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Check for Google Play Credentials
        id: check_creds
        env:
          PLAY_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          if [ -n "$PLAY_KEY" ]; then
            echo "has_key=true" >> $GITHUB_OUTPUT
            echo "Google Play Service Account key found in repository secrets."
          else
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "Google Play Service Account key NOT configured yet."
          fi

      - name: Upload and Publish to Google Play Store Track
        if: steps.check_creds.outputs.has_key == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.rossofuoco.personale
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.status || 'completed' }}
          whatsNewDirectory: store_assets/play_store_metadata

      - name: Write Job Summary
        run: |
          echo "## 🤖 Android Build & Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Status | Location |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Android App Bundle (AAB)** | ✅ Compiled | Download from *Artifacts* -> \`RossoFuoco-Release-AAB\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Android APK** | ✅ Compiled | Download from *Artifacts* -> \`RossoFuoco-Release-APK\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_creds.outputs.has_key }}" == "true" ]; then
            echo "🚀 **Google Play Auto-Deploy:** Release successfully dispatched to Google Play (${{ github.event.inputs.track || 'internal' }})!" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **ACTION REQUIRED:** Add the secret \`PLAY_STORE_JSON_KEY\` to your GitHub repository secrets to enable 100% automated background publishing without opening the browser." >> $GITHUB_STEP_SUMMARY
          fi
