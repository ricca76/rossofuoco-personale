name: Deploy Android App to Google Play

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/deploy-playstore.yml'
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build & Publish Android Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build Release Bundle (AAB) & APK
        run: |
          gradle :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Upload App Bundle Artifact (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: RossoFuoco-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RossoFuoco-Release-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Check for Google Play Credentials
        id: check_creds
        env:
          PLAY_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          if [ -n "$PLAY_KEY" ]; then
            echo "has_key=true" >> $GITHUB_OUTPUT
            echo "Google Play Service Account key found in repository secrets."
          else
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "Google Play Service Account key NOT configured yet."
          fi

      - name: Upload to Google Play Internal Sharing / Track
        if: steps.check_creds.outputs.has_key == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.rossofuoco.personale
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Write Job Summary
        run: |
          echo "## 🤖 Android Build & Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Status | Download Location |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Android App Bundle (AAB)** | ✅ Compiled | Download from *Artifacts* -> \`RossoFuoco-Release-AAB\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Android APK** | ✅ Compiled | Download from *Artifacts* -> \`RossoFuoco-Release-APK\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_creds.outputs.has_key }}" == "true" ]; then
            echo "🚀 **Google Play Auto-Deploy:** Release uploaded directly to Google Play Internal Testing track!" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **Manual Play Console Upload:** To publish or update test tracks, download \`RossoFuoco-Release-AAB\` above and upload it to [Google Play Console](https://play.google.com/console) under *Test interni*." >> $GITHUB_STEP_SUMMARY
          fi
