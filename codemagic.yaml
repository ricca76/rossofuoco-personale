workflows:
  ios-release:
    name: 🍎 iOS TestFlight & App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "codemagic.io"
    environment:
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.rossofuoco.personale"
        APP_STORE_CONNECT_BUNDLE_IDENTIFIER: "com.rossofuoco.personale"
        APPLE_TEAM_ID: "H4ZVRKZ2QZ"
        XCODE_PROJECT: "RossoFuoco.xcodeproj"
        XCODE_SCHEME: "RossoFuoco"
        # The following will read from Codemagic Environment Variables or default to integrations
        APP_STORE_CONNECT_KEY_IDENTIFIER: ${APP_STORE_CONNECT_KEY_ID:-""}
        APP_STORE_CONNECT_ISSUER_ID: ${APP_STORE_CONNECT_ISSUER_ID:-""}
        APP_STORE_CONNECT_PRIVATE_KEY: ${APP_STORE_CONNECT_PRIVATE_KEY:-""}
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
      - name: Generate Xcode Project
        script: |
          xcodegen generate
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Set up signing certificate
        script: |
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          keychain add-certificates \
            --certificate /tmp/certificate.p12 \
            --certificate-password "$CM_CERTIFICATE_PASSWORD"
      - name: Set up provisioning profile
        script: |
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          echo "$CM_PROVISIONING_PROFILE" | base64 --decode > "$PROFILES_HOME/RossoFuoco_Personale_AppStore.mobileprovision"
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Increment build number
        script: |
          BUILD_NUMBER=$(python3 -c '
          import base64, subprocess, time, urllib.request, json, os
          key_id = os.environ.get("APP_STORE_CONNECT_KEY_IDENTIFIER", "GR53DN344C")
          issuer_id = os.environ.get("APP_STORE_CONNECT_ISSUER_ID", "d958d7b5-8557-4cc6-9d2b-43128ac100a3")
          p8_key = os.environ.get("APP_STORE_CONNECT_PRIVATE_KEY", "")
          with open("/tmp/asc_key.p8", "w") as f:
              f.write(p8_key)
          def b64url(d):
              if isinstance(d, str): d = d.encode("utf-8")
              return base64.urlsafe_b64encode(d).decode("utf-8").rstrip("=")
          header = {"alg": "ES256", "kid": key_id, "typ": "JWT"}
          now = int(time.time())
          payload = {"iss": issuer_id, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"}
          signing_input = f"{b64url(json.dumps(header))}.{b64url(json.dumps(payload))}"
          p = subprocess.Popen(["openssl", "dgst", "-sha256", "-sign", "/tmp/asc_key.p8"], stdin=subprocess.PIPE, stdout=subprocess.PIPE)
          der_sig, _ = p.communicate(signing_input.encode("utf-8"))
          idx = 2; r_len = der_sig[idx+1]; r = der_sig[idx+2 : idx+2+r_len]; idx = idx + 2 + r_len; s_len = der_sig[idx+1]; s = der_sig[idx+2 : idx+2+s_len]
          raw_sig = r[-32:].rjust(32, b"\x00") + s[-32:].rjust(32, b"\x00")
          token = f"{signing_input}.{b64url(raw_sig)}"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          try:
              req_builds = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/builds?filter[app]=6803344018&limit=50", headers=headers)
              with urllib.request.urlopen(req_builds) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
                  versions = [int(b["attributes"]["version"]) for b in data.get("data", []) if b["attributes"].get("version", "").isdigit()]
                  max_v = max(versions) if versions else 83
                  print(max_v + 1)
          except Exception as e:
              print(84)
          ')
          echo "Computed next build number: $BUILD_NUMBER"
          agvtool new-version -all "$BUILD_NUMBER" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/Info.plist || true
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - "build/ios/ipa/*.ipa"
      - "/tmp/xcodebuild_logs/*.log"
      - "*.dSYM.zip"
    publishing:
      email:
        recipients:
          - r.decori76@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration # Uses Codemagic App Store Connect integration or API Key
        submit_to_testflight: true
        submit_to_app_store: false
        expire_build_submitted_for_review: true

  android-release:
    name: 🤖 Android Google Play Release
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      android_signing:
        - PlayStoreKey
      vars:
        PACKAGE_NAME: "com.rossofuoco.personale"
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build Android AAB & APK
        script: |
          gradle :app:bundleRelease :app:assembleRelease --stacktrace
    artifacts:
      - "app/build/outputs/bundle/release/*.aab"
      - "app/build/outputs/apk/release/*.apk"
    publishing:
      email:
        recipients:
          - r.decori76@gmail.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
