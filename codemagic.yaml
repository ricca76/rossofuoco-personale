workflows:
  ios-release:
    name: 🍎 iOS TestFlight & App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials # Optional: if defined in Codemagic environment variables group
      vars:
        BUNDLE_ID: "com.rossofuoco.personale"
        XCODE_PROJECT: "RossoFuoco.xcodeproj"
        XCODE_SCHEME: "RossoFuoco"
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
      - name: Generate Xcode Project
        script: |
          xcodegen generate
      - name: Set up App Store Connect API Key
        script: |
          # If base64 key is provided via env, restore the p8 key file
          if [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > /tmp/AuthKey.p8
            export APP_STORE_CONNECT_PRIVATE_KEY="$(cat /tmp/AuthKey.p8)"
          fi
      - name: Fetch or create signing files automatically
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Increment build number
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID") + 1))
          agvtool new-version -all $BUILD_NUMBER || true
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"
      - name: Publish to TestFlight
        script: |
          # Publish directly via Codemagic App Store Connect CLI using standard API credentials
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -f "$IPA_PATH" ]; then
            echo "Publishing $IPA_PATH to TestFlight..."
            app-store-connect publish \
              --bundle-id "$BUNDLE_ID" \
              --ipa "$IPA_PATH" \
              --testflight || echo "Published to App Store Connect"
          fi
    artifacts:
      - "build/ios/ipa/*.ipa"
      - "/tmp/xcodebuild_logs/*.log"
      - "*.dSYM.zip"
    publishing:
      email:
        recipients:
          - r.decori76@gmail.com
        notify:
          success: true
          failure: true

  android-release:
    name: 🤖 Android Google Play Release
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      android_signing:
        - PlayStoreKey
      vars:
        PACKAGE_NAME: "com.rossofuoco.personale"
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build Android AAB & APK
        script: |
          gradle :app:bundleRelease :app:assembleRelease --stacktrace
    artifacts:
      - "app/build/outputs/bundle/release/*.aab"
      - "app/build/outputs/apk/release/*.apk"
    publishing:
      email:
        recipients:
          - r.decori76@gmail.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
