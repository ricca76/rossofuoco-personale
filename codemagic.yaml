workflows:
  ios-release:
    name: 🍎 iOS TestFlight & App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rossofuoco.personale
      vars:
        XCODE_PROJECT: "RossoFuoco.xcodeproj"
        XCODE_SCHEME: "RossoFuoco"
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
      - name: Generate Xcode Project
        script: |
          xcodegen generate
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Increment build number
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_CONNECT_BUNDLE_IDENTIFIER") + 1))
          agvtool new-version -all $BUILD_NUMBER || true
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - "build/ios/ipa/*.ipa"
      - "/tmp/xcodebuild_logs/*.log"
      - "*.dSYM.zip"
    publishing:
      email:
        recipients:
          - r.decori76@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration # Uses Codemagic App Store Connect integration or API Key
        submit_to_testflight: true
        submit_to_app_store: false
        expire_build_submitted_for_review: true

  android-release:
    name: 🤖 Android Google Play Release
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      android_signing:
        - PlayStoreKey
      vars:
        PACKAGE_NAME: "com.rossofuoco.personale"
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build Android AAB & APK
        script: |
          gradle :app:bundleRelease :app:assembleRelease --stacktrace
    artifacts:
      - "app/build/outputs/bundle/release/*.aab"
      - "app/build/outputs/apk/release/*.apk"
    publishing:
      email:
        recipients:
          - r.decori76@gmail.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
