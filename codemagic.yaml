workflows:
  ios-release:
    name: 🍎 iOS TestFlight & App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "codemagic.io"
    environment:
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.rossofuoco.personale"
        APP_STORE_CONNECT_BUNDLE_IDENTIFIER: "com.rossofuoco.personale"
        APPLE_TEAM_ID: "H4ZVRKZ2QZ"
        XCODE_PROJECT: "RossoFuoco.xcodeproj"
        XCODE_SCHEME: "RossoFuoco"
        # The following will read from Codemagic Environment Variables or default to integrations
        APP_STORE_CONNECT_KEY_IDENTIFIER: ${APP_STORE_CONNECT_KEY_ID:-""}
        APP_STORE_CONNECT_ISSUER_ID: ${APP_STORE_CONNECT_ISSUER_ID:-""}
        APP_STORE_CONNECT_PRIVATE_KEY: ${APP_STORE_CONNECT_PRIVATE_KEY:-""}
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
      - name: Generate Xcode Project
        script: |
          xcodegen generate
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Set up signing certificate
        script: |
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          keychain add-certificates \
            --certificate /tmp/certificate.p12 \
            --certificate-password "$CM_CERTIFICATE_PASSWORD"
      - name: Set up provisioning profile
        script: |
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          echo "$CM_PROVISIONING_PROFILE" | base64 --decode > "$PROFILES_HOME/RossoFuoco_Personale_AppStore.mobileprovision"
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Increment build number
        script: |
          BUILD_NUM=$((83 + $BUILD_NUMBER))
          echo "Setting Build Number to: $BUILD_NUM"
          agvtool new-version -all "$BUILD_NUM" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" ios/Info.plist || true
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - "build/ios/ipa/*.ipa"
      - "/tmp/xcodebuild_logs/*.log"
      - "*.dSYM.zip"
    publishing:
      email:
        recipients:
          - r.decori76@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration # Uses Codemagic App Store Connect integration or API Key
        submit_to_testflight: true
        submit_to_app_store: false
        expire_build_submitted_for_review: true

  android-release:
    name: 🤖 Android Google Play Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_NAME: "com.rossofuoco.personale"
        KEYSTORE_PATH: "release-upload.keystore"
        KEYSTORE_PASSWORD: "RossoFuoco2026SecureKey!"
        KEY_ALIAS: "rossofuoco"
        KEY_PASSWORD: "RossoFuoco2026SecureKey!"
      java: 17
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Set up Release Keystore
        script: |
          if [ -n "$CM_KEYSTORE" ]; then
            echo "Decoding custom CM_KEYSTORE from environment..."
            echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/release-upload.keystore"
          fi
      - name: Build Android AAB & APK
        script: |
          gradle :app:bundleRelease :app:assembleRelease --stacktrace
      - name: Publish to Google Play (if Service Account JSON is configured)
        script: |
          if [ -n "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" ]; then
            echo "Google Play credentials detected! Preparing deployment..."
            echo "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" > /tmp/google_play_key.json
            python3 scripts/publish_playstore.py /tmp/google_play_key.json internal || true
          else
            echo "ℹ️ GCLOUD_SERVICE_ACCOUNT_CREDENTIALS not provided in environment."
            echo "Signed release AAB and APK have been produced and will be uploaded to Codemagic artifacts."
          fi
    artifacts:
      - "app/build/outputs/bundle/release/*.aab"
      - "app/build/outputs/apk/release/*.apk"
    publishing:
      email:
        recipients:
          - r.decori76@gmail.com
        notify:
          success: true
          failure: true
