workflows:
  ios-release:
    name: 🍎 iOS TestFlight & App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "codemagic.io"
    environment:
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.rossofuoco.personale"
        APP_STORE_CONNECT_BUNDLE_IDENTIFIER: "com.rossofuoco.personale"
        APPLE_TEAM_ID: "H4ZVRKZ2QZ"
        XCODE_PROJECT: "RossoFuoco.xcodeproj"
        XCODE_SCHEME: "RossoFuoco"
        # The following will read from Codemagic Environment Variables or default to integrations
        APP_STORE_CONNECT_KEY_IDENTIFIER: ${APP_STORE_CONNECT_KEY_ID:-""}
        APP_STORE_CONNECT_ISSUER_ID: ${APP_STORE_CONNECT_ISSUER_ID:-""}
        APP_STORE_CONNECT_PRIVATE_KEY: ${APP_STORE_CONNECT_PRIVATE_KEY:-""}
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
      - name: Generate Xcode Project
        script: |
          xcodegen generate
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Set up signing certificate
        script: |
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          keychain add-certificates \
            --certificate /tmp/certificate.p12 \
            --certificate-password "$CM_CERTIFICATE_PASSWORD"
      - name: Set up provisioning profile
        script: |
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          echo "$CM_PROVISIONING_PROFILE" | base64 --decode > "$PROFILES_HOME/RossoFuoco_Personale_AppStore.mobileprovision"
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Increment build number
        script: |
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_CONNECT_BUNDLE_IDENTIFIER" || echo "56")
          if [ -z "$LATEST_BUILD" ] || [ "$LATEST_BUILD" = "None" ] || [ "$LATEST_BUILD" -lt 56 ]; then
            BUILD_NUMBER=$((56 + $BUILD_NUMBER))
          else
            BUILD_NUMBER=$(($LATEST_BUILD + 1))
          fi
          echo "Setting Build Number to: $BUILD_NUMBER"
          agvtool new-version -all "$BUILD_NUMBER" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/Info.plist || true
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - "build/ios/ipa/*.ipa"
      - "/tmp/xcodebuild_logs/*.log"
      - "*.dSYM.zip"
    publishing:
      email:
        recipients:
          - r.decori76@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration # Uses Codemagic App Store Connect integration or API Key
        submit_to_testflight: true
        submit_to_app_store: false
        expire_build_submitted_for_review: true

  android-release:
    name: 🤖 Android Google Play Release
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      android_signing:
        - PlayStoreKey
      vars:
        PACKAGE_NAME: "com.rossofuoco.personale"
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build Android AAB & APK
        script: |
          gradle :app:bundleRelease :app:assembleRelease --stacktrace
    artifacts:
      - "app/build/outputs/bundle/release/*.aab"
      - "app/build/outputs/apk/release/*.apk"
    publishing:
      email:
        recipients:
          - r.decori76@gmail.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
